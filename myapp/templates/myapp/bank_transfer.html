{% extends 'myapp/base.html' %}
{% block body %}

<!-- Page header -->
<div class="bg-[#F5F0E8] border-b border-[#D4A017]/20 py-10 text-center">
    <p class="text-xs uppercase tracking-widest text-[#8B6914]/60 mb-2 font-semibold">Step 2 of 3</p>
    <h1 class="text-3xl font-bold font-playfair text-[#8B6914]">Complete Your Payment <span class="text-[#D4A017]">✦</span></h1>
</div>

<div class="flex justify-center px-4 py-12">
    <div class="bg-white rounded-2xl shadow-md p-8 border border-[#D4A017]/20 w-full max-w-lg">

        <!-- Bank details box -->
        <div class="bg-[#F5F0E8] border-l-4 border-[#D4A017] rounded-r-xl p-5 mb-6">
            <h3 class="font-bold font-playfair text-[#8B6914] text-lg mb-3">Bank Transfer Details</h3>
            <div class="space-y-2 text-sm text-[#5A3E1A]">
                <div class="flex gap-2"><span class="text-[#8B6914]/60 min-w-[130px]">Account Name:</span><span class="font-medium">Your Business Name</span></div>
                <div class="flex gap-2"><span class="text-[#8B6914]/60 min-w-[130px]">Account Number:</span><span class="font-medium">123456789</span></div>
                <div class="flex gap-2"><span class="text-[#8B6914]/60 min-w-[130px]">Bank Name:</span><span class="font-medium">Your Bank Name</span></div>
                <div class="flex gap-2"><span class="text-[#8B6914]/60 min-w-[130px]">Branch Code:</span><span class="font-medium">001234</span></div>
                <div class="flex gap-2"><span class="text-[#8B6914]/60 min-w-[130px]">SWIFT Code:</span><span class="font-medium">ABCD1234</span></div>
            </div>
        </div>

        <hr class="border-[#D4A017]/30 mb-6">

        <form method="post" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}
            <input type="hidden" name="product_id" value="{{ product.id }}">

            <div>
                <label class="block text-sm font-medium text-[#8B6914] mb-1.5">Amount Paid</label>
                <input type="text" name="amount" id="amount" value="{{ product.price|floatformat:0 }}" required
                       class="w-full border border-[#8B6914]/40 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-[#D4A017] bg-[#FFFDF8] text-[#3A2A10]">
            </div>

            <div>
                <label class="block text-sm font-medium text-[#8B6914] mb-1.5">Your Email</label>
                <input type="email" name="customer_email" id="customer_email" value="{{ user.email }}"
                       class="w-full border border-[#8B6914]/40 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-[#D4A017] bg-[#FFFDF8] text-[#3A2A10]">
            </div>

            <div>
                <label class="block text-sm font-medium text-[#8B6914] mb-1.5">Upload Payment Receipt</label>
                <div class="border-2 border-dashed border-[#D4A017]/50 rounded-xl p-5 text-center bg-[#FFFDF8]">
                    <p class="text-[#8B6914]/50 text-xs mb-2">PNG, JPG, or PDF accepted</p>
                    <input type="file" name="reciept" id="reciept" required class="text-sm text-[#5A3E1A]">
                </div>
            </div>

            <button type="submit"
                    class="w-full bg-[#D4A017] text-white rounded-full px-6 py-3.5 font-semibold hover:bg-[#6B4F10] transition-colors">
                Submit Payment
            </button>
        </form>

    </div>
</div>

{% endblock %}
